<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Overview · Homelab</title>
    <script src="/ds/theme.js"></script>
    <link rel="icon" href="/ds/favicon.svg" />
    <link rel="stylesheet" href="/ds/ds.css" />
    <link rel="stylesheet" href="/home.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="sidebar"></aside>
      <main class="main">
        <div class="main-inner">
          <header class="page-header">
            <div>
              <div class="cluster">
                <span class="dot" aria-hidden="true"></span>
                <span class="eyebrow" id="status">Online</span>
              </div>
              <h1 id="host">Overview</h1>
              <p id="platform">Loading system details…</p>
            </div>
            <div class="cluster" id="lan"></div>
          </header>

          <section aria-labelledby="actions-title">
            <div class="section-head"><h2 class="eyebrow" id="actions-title">Quick actions</h2></div>
            <div class="actions" id="actions"></div>
          </section>

          <section class="section" aria-labelledby="health-title">
            <div class="section-head">
              <h2 class="eyebrow" id="health-title">Host health</h2>
              <span class="faint mono" id="updated"></span>
            </div>
            <div class="grid">
              <article class="card span-3" id="cpu"></article>
              <article class="card span-3" id="memory"></article>
              <article class="card span-3" id="disk"></article>
              <article class="card span-3" id="traffic"></article>
            </div>
          </section>

          <section class="section" aria-labelledby="usage-title">
            <div class="section-head"><h2 class="eyebrow" id="usage-title">Storage &amp; usage</h2></div>
            <div class="grid">
              <article class="card span-6" id="storage"></article>
              <article class="card span-3" id="areas"></article>
              <article class="card span-3" id="network"></article>
            </div>
          </section>

          <section class="section" aria-labelledby="recent-title">
            <div class="section-head"><h2 class="eyebrow" id="recent-title">Recent</h2></div>
            <div class="grid" id="recent"></div>
          </section>

          <section class="section" aria-labelledby="tools-title">
            <div class="section-head"><h2 class="eyebrow" id="tools-title">Tools</h2></div>
            <div class="tool-grid" id="tools"></div>
          </section>
        </div>
      </main>
    </div>
    <script type="module" src="/home.js"></script>
  </body>
</html>
