services:
  utility-server:
    build: .
    image: homelab/utility-server:latest
    container_name: utility-server
    hostname: ${LAB_HOSTNAME:-homelab}
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    environment:
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-4096}
      # The container only sees its bridge IP; list the host's LAN address(es), e.g. http://192.168.1.20:3000
      LAN_URLS: ${LAN_URLS:-}
    volumes:
      # Host folder the Files tool manages; change the left side to point at your media.
      - ${DATA_PATH:-./data}:/data
