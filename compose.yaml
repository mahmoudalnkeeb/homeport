services:
  postgres:
    image: postgres:18-alpine
    container_name: homelab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-homelab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-homelab}
      POSTGRES_DB: ${POSTGRES_DB:-homelab}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  utility-server:
    build: .
    image: homelab/utility-server:latest
    container_name: utility-server
    hostname: ${LAB_HOSTNAME:-homelab}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${PORT:-3000}:3000'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-homelab}:${POSTGRES_PASSWORD:-homelab}@postgres:5432/${POSTGRES_DB:-homelab}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-4096}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      PUBLIC_PORT: ${PORT:-3000}
      HOST_AGENT_URL: ${HOST_AGENT_URL:-http://host.docker.internal:3001}
      AGENT_TOKEN: ${AGENT_TOKEN:-}
      LAN_URLS: ${LAN_URLS:-}
    volumes:
      - ${DATA_PATH:-./data}:/data
      - ${STATE_PATH:-./state}:/state

volumes:
  pgdata:
